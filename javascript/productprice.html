<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let productPrice=[500,2600,850,950,5500,6000];
        console.log(productPrice);
//mapping 10% discount to product size
        let mappedprices=productPrice.map((price)=>{
            return price/10;
        });
        //filter the discounted products 1000 to 5000rs prices

        let filteredProducts=mappedprices.filter((price)=>{
            return price>=1000&&price<=5000;
        })
       console.log(filteredProducts);

       //total sum of mappedprices
       let totalPrice= mappedprices.reduce((price ,acc)=> {
        return price+acc;
       },250)
       console.log(totalPrice);

    </script>
</body>
</html>
